<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>reCAPTCHA v3 — ізольований тест</title>
  <script src="https://www.google.com/recaptcha/api.js?render=6Lcj25QtAAAAACtSbAp6sUuvTXSlmPATueXSLm77"></script>
</head>
<body>
  <h1>Тест reCAPTCHA v3</h1>
  <button id="testBtn">Натисни для тесту</button>
  <pre id="output" style="white-space: pre-wrap; background: #f0f0f0; padding: 10px; margin-top: 20px;"></pre>

  <script>
    var out = document.getElementById('output');
    function log(msg) {
      out.textContent += msg + '\n';
      console.log(msg);
    }

    document.getElementById('testBtn').addEventListener('click', function () {
      log('Клік зафіксовано. typeof grecaptcha: ' + typeof grecaptcha);

      if (typeof grecaptcha === 'undefined') {
        log('grecaptcha ще не завантажився.');
        return;
      }

      grecaptcha.ready(function () {
        log('grecaptcha.ready спрацював. Викликаю execute...');

        grecaptcha.execute('6Lcj25QtAAAAACtSbAp6sUuvTXSlmPATueXSLm77', { action: 'test' })
          .then(function (token) {
            log('УСПІХ! Токен отримано, довжина: ' + token.length);
          })
          .catch(function (err) {
            log('ПОМИЛКА: ' + err);
          });
      });
    });

    window.addEventListener('load', function () {
      log('Сторінка завантажена. typeof grecaptcha одразу: ' + typeof grecaptcha);
    });
  </script>
</body>
</html>
