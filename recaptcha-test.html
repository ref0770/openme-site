<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>reCAPTCHA Enterprise — тест гіпотези</title>
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6Lcj25QtAAAAACtSbAp6sUuvTXSlmPATueXSLm77"></script>
</head>
<body>
  <h1>Тест reCAPTCHA Enterprise</h1>
  <button id="testBtn">Натисни для тесту</button>
  <pre id="output" style="white-space: pre-wrap; background: #f0f0f0; padding: 10px; margin-top: 20px;"></pre>

  <script>
    var out = document.getElementById('output');
    function log(msg) {
      out.textContent += msg + '\n';
      console.log(msg);
    }

    document.getElementById('testBtn').addEventListener('click', function () {
      log('Клік зафіксовано. typeof grecaptcha: ' + typeof grecaptcha);
      log('typeof grecaptcha.enterprise: ' + (typeof grecaptcha !== 'undefined' ? typeof grecaptcha.enterprise : 'n/a'));

      if (typeof grecaptcha === 'undefined' || typeof grecaptcha.enterprise === 'undefined') {
        log('grecaptcha.enterprise ще не завантажився.');
        return;
      }

      grecaptcha.enterprise.ready(function () {
        log('grecaptcha.enterprise.ready спрацював. Викликаю execute...');

        grecaptcha.enterprise.execute('6Lcj25QtAAAAACtSbAp6sUuvTXSlmPATueXSLm77', { action: 'test' })
          .then(function (token) {
            log('УСПІХ! Токен отримано, довжина: ' + token.length);
          })
          .catch(function (err) {
            log('ПОМИЛКА: ' + err);
          });
      });
    });

    window.addEventListener('load', function () {
      log('Сторінка завантажена. typeof grecaptcha одразу: ' + typeof grecaptcha);
    });
  </script>
</body>
</html>
